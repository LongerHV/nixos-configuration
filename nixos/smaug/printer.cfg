[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 5000
max_z_velocity: 5
max_z_accel: 100

[extruder]
max_extrude_only_distance: 100.0
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 5.6
nozzle_diameter: 0.600
max_extrude_cross_section: 5
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 260

# For calibration use only
# min_extrude_temp: 20
# max_extrude_only_accel: 500

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
homing_speed: 50

position_endstop: -4
position_min: -4
position_max: 250

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 235
homing_speed: 50

position_endstop: -5
position_min: -5
position_max: 221

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 250

[bltouch]
sensor_pin: ^PB1
control_pin: PB0
x_offset: -57.5
y_offset: -11
probe_with_touch_mode: True
stow_on_each_sample: False
samples: 2
sample_retract_dist: 3
samples_result: median
samples_tolerance: 0.02
samples_tolerance_retries: 3
speed: 5
lift_speed: 10

[bed_mesh]
speed: 200
horizontal_move_z: 5
mesh_min: 5, 5
mesh_max: 190, 208
probe_count: 7, 7
algorithm: bicubic
fade_end: 10
adaptive_margin: 10

[safe_z_home]
home_xy_position: 175, 121
speed: 50
z_hop: 10
z_hop_speed: 5

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 130

[fan]
pin: PA0

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[temperature_sensor mcu]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 10
max_temp: 100

[mcu host]
  serial: /tmp/klipper_host_mcu

[temperature_sensor host]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[virtual_sdcard]
path: /var/lib/moonraker/gcodes

[idle_timeout]
timeout: 600

[display_status]

[exclude_object]

[respond]

[pause_resume]

[gcode_macro M600]
gcode:
    PAUSE

# [filament_switch_sensor my_sensor]
# pause_on_runout: True
# switch_pin: PA4
# event_delay: 3.0
# pause_delay: 0.5

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
    ##### set defaults #####
    {% set x = params.X|default(230) %}      #edit to your park position
    {% set y = params.Y|default(230) %}      #edit to your park position
    {% set z = params.Z|default(10)|float %} #edit to your park position
    {% set e = params.E|default(1) %}        #edit to your retract length
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set lift_z = z|abs %}
    {% if act_z < (max_z - lift_z) %}
        {% set z_safe = lift_z %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    ##### end of definitions #####
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-{e} F1500
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}
      G1 Z{z_safe}
      G90
      G1 X{x} Y{y} F6000
    {% else %}
      {action_respond_info("Printer not homed")}
    {% endif %}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    ##### set defaults #####
    {% set e = params.E|default(1) %} #edit to your retract length
    #### get VELOCITY parameter if specified ####
    {% if 'VELOCITY' in params|upper %}
      {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
    {%else %}
      {% set get_params = "" %}
    {% endif %}
    ##### end of definitions #####
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E{e} F1500
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    PRINT_END

[gcode_macro Y_STRESS]
gcode:
    G28
    G90
    G1 Z10 F600
    G1 Y5 F3000
    M400
    {% for i in range(params.COUNT|default(50)|int) %}
      G1 Y{printer.toolhead.axis_maximum.y - 10} F{params.SPEED|default(9000)}
      G1 Y10 F{params.SPEED|default(9000)}
    {% endfor %}
    G1 Y5 F3000

[gcode_macro PRINT_START]
description: Heat, home, mesh and prime
gcode:
    {% set BED = params.BED|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(200)|float %}
    {% set IDLE = params.IDLE|default(150)|float %}

    G90                          ; absolute coordinates
    M83                          ; relative extrusion
    M104 S{IDLE}                 ; idle nozzle temp to prevent oozing during homing
    M140 S{BED}                  ; start heating bed
    G4 P30000                    ; partial nozzle warmup (30 s)
    G28                          ; home all axes
    M190 S{BED}                  ; wait for bed
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1
    G1 Z50 F240
    G1 X2.0 Y10 F3000
    M109 S{EXTRUDER}             ; final nozzle temp and wait
    G1 Z0.28 F240
    G92 E0
    G1 X2.0 Y140 E10 F1500       ; prime line 1
    G1 X2.3 Y140 F5000
    G92 E0
    G1 X2.3 Y10 E10 F1200        ; prime line 2
    G92 E0

[gcode_macro PRINT_END]
description: Retract, lift, cool down, disable motors
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set safe_z = [printer.toolhead.position.z + 10, max_z]|min %}

    M400                         ; wait for moves to finish
    G91
    G1 E-2 F2400                 ; small retract to reduce oozing
    G90
    G1 Z{safe_z} F600            ; lift nozzle off the print
    M104 S0                      ; nozzle heater off
    M140 S0                      ; bed heater off
    M107                         ; part fan off
    G28 X                        ; home X
    M84                          ; disable motors

