name: Run flake checks

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

jobs:
  check:
    name: Run flake evaluation checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          source-tag: v3.16.3
      - name: Workaround for broken check
        run: nix eval --json .#iproute2
      # uv2nix reads uv.lock from a filtered source path at eval time, which
      # `nix flake check --no-build` refuses to realise.
      - name: Workaround for hermes-agent source realisation
        run: nix eval --raw .#nixosConfigurations.nasgul.config.services.hermes-agent.package.drvPath
      - name: Run checks
        run: nix flake check --no-build --all-systems
